name: Build APK
on: [push, workflow_dispatch]
defaults:
  run:
    working-directory: pano360-apk-project
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Проверка google-services.json
        run: test -s android/app/google-services.json || (echo "Нет android/app/google-services.json" && exit 1)
      - run: npm install
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pano360-apk
          path: pano360-apk-project/android/app/build/outputs/apk/release/app-release.apk
